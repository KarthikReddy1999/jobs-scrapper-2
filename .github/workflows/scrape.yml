name: Trigger Simplify Scrape

on:
  schedule:
    - cron: "30 * * * *"  # every hour at :30 (offset from Jobright to avoid overlap)
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape
        run: |
          curl -s -X POST "${{ secrets.HF_SPACE_URL }}/scrape/all" \
            -H "x-api-key: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
