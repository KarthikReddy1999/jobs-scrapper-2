name: Trigger Simplify Scrape

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'  # 4x daily at 2am, 8am, 2pm, 8pm UTC (offset from other scrapers)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape
        run: |
          curl -s -X POST "${{ secrets.HF_SPACE_URL }}/scrape/all" \
            -H "x-api-key: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
